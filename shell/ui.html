<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Shell</title>
<style>
:root{--bg:#080f23;--term:#050a18;--border:#344360;--text:#e6ecfa;--muted:#aab8d1;--prompt:#8fbaff;--danger:#ef8a80;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#f5f8ff;--term:#ffffff;--border:#c9d3e6;--text:#0b1430;--muted:#4a5878;--prompt:#123bb5;--danger:#b3261e}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;padding:12px;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.bar .info{flex:1;min-width:200px}.bar code{font-family:var(--mono)}
button,select{height:30px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:transparent;color:inherit;font:inherit;cursor:pointer}
#term{flex:1;min-height:320px;overflow:auto;padding:10px 12px;background:var(--term);border:1px solid var(--border);border-radius:8px;
 font:13px/1.45 var(--mono);white-space:pre-wrap;word-break:break-all;cursor:text}
#term:focus-within{border-color:var(--prompt)}
.p{color:var(--prompt)}.err{color:var(--danger)}.note{color:var(--muted)}
#line{display:flex;align-items:baseline}
#line .p{white-space:pre;flex-shrink:0}
#cmd{flex:1;min-width:2ch;margin:0;padding:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;caret-color:var(--prompt)}
#line.busy #cmd{visibility:hidden}
</style></head><body>
<div class="bar">
 <span class="info">Root shell on the TV, one command at a time (bash if the TV has it). <code>cd</code> is remembered; variables are not. No <code>vi</code>/<code>top</code>/<code>less</code>: use <code>top -b -n 1</code>. A command here can damage the TV: read it before you run it.</span>
 <label>Time limit <select id="limit"><option value="10">10 s</option><option value="30" selected>30 s</option><option value="60">60 s</option></select></label>
 <label title="Commands can contain secrets typed on the command line"><input id="save" type="checkbox" checked> Save history</label>
 <button id="forget" type="button">Clear history</button>
 <button id="clear" type="button" title="Ctrl+L">Clear screen</button>
</div>
<div id="term" role="log" aria-live="polite" aria-label="Shell"><div id="out"></div><div id="line"><span class="p" id="prompt">root@tv:/# </span><input id="cmd" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Command" autofocus></div></div>
<script>
var cwd='/',busy=false,hist=[],pos=0,draft='',MAXNODES=2000;
function $(id){return document.getElementById(id)}
function ps1(){return 'root@tv:'+cwd+'# '}
function prompt(){$('prompt').textContent=ps1()}
function bottom(){var t=$('term');t.scrollTop=t.scrollHeight}
function print(t,c){if(!t)return;var o=$('out'),s=document.createElement('span');if(c)s.className=c;s.textContent=t;o.appendChild(s);while(o.childNodes.length>MAXNODES)o.removeChild(o.firstChild);bottom()}
function nl(t){return t&&t.charAt(t.length-1)!=='\n'?t+'\n':t}
// A request that gets no readable answer (the browser says only "Load failed" or "Failed to fetch") almost always
// means this page's session ended: it does when the Shard is switched off or updated, and after 8 hours.
var GONE='no answer from the Shard. Its page session ends when the Shard is switched off or updated, and after 8 hours: open the Shell tab again.';
function api(u,b){return fetch(u,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().catch(function(){throw new Error(GONE)}).then(function(d){if(!r.ok&&d.stdout===undefined)throw new Error(d.error||GONE);return d})},function(){throw new Error(GONE)})}
function clear(){$('out').textContent='';$('cmd').focus()}
function settings(d){if(typeof d.saveHistory==='boolean')$('save').checked=d.saveHistory}
api('state').then(function(d){cwd=d.cwd||'/';hist=d.history||[];pos=hist.length;settings(d);prompt()}).catch(function(e){print('vetro: '+e.message+'\n','err');prompt()});
$('save').onchange=function(){var on=this.checked;api('settings',{saveHistory:on}).then(function(d){settings(d);if(!on){hist=[];pos=0}print((on?'[history is saved on the TV]':'[history is not saved; saved history deleted]')+'\n','note')}).catch(function(e){$('save').checked=!on;print('vetro: '+e.message+'\n','err')}).then(function(){$('cmd').focus()})};
$('forget').onclick=function(){api('history/clear',{}).then(function(){hist=[];pos=0;draft='';print('[history cleared]\n','note')}).catch(function(e){print('vetro: '+e.message+'\n','err')}).then(function(){$('cmd').focus()})};
function run(cmd){
 // the prompt line becomes scrollback, as in a terminal
 print(ps1(),'p');print(cmd+'\n');
 if(hist[hist.length-1]!==cmd&&cmd.trim())hist.push(cmd);pos=hist.length;draft='';
 if(!cmd.trim())return;
 if(cmd.trim()==='clear'){clear();return}
 busy=true;$('line').className='busy';$('prompt').textContent='';
 api('run',{cmd:cmd,cwd:cwd,timeout:Number($('limit').value)*1000}).then(function(d){
  print(nl(d.stdout));print(nl(d.stderr),'err');
  if(d.timed_out)print('[stopped after '+$('limit').value+' s: time limit]\n','note');
  if(d.truncated)print('[output cut at 256 KB]\n','note');
  if(d.cwd)cwd=d.cwd;
 }).catch(function(e){print('vetro: '+e.message+'\n','err')}).then(function(){busy=false;$('line').className='';prompt();$('cmd').focus();bottom()})}
$('cmd').onkeydown=function(e){
 if(e.key==='Enter'){e.preventDefault();if(busy)return;var c=this.value;this.value='';run(c)}
 else if(e.key==='ArrowUp'){e.preventDefault();if(pos===hist.length)draft=this.value;if(pos>0)this.value=hist[--pos]}
 else if(e.key==='ArrowDown'){e.preventDefault();if(pos<hist.length){pos++;this.value=pos===hist.length?draft:hist[pos]}}
 else if(e.ctrlKey&&(e.key==='l'||e.key==='L')){e.preventDefault();clear()}
 else if(e.ctrlKey&&(e.key==='c'||e.key==='C')&&!window.getSelection().toString()){e.preventDefault();if(busy)return;print(ps1(),'p');print(this.value+'^C\n');this.value='';pos=hist.length}
 else if(e.ctrlKey&&(e.key==='u'||e.key==='U')){e.preventDefault();this.value=''}};
// a click anywhere in the terminal types at the prompt, unless you are selecting text to copy
$('term').onmouseup=function(){if(!window.getSelection().toString())$('cmd').focus()};
$('clear').onclick=clear;
prompt();
</script></body></html>
